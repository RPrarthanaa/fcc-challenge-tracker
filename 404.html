<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const pathSegmentsToKeep = 1;

      const l = window.location;
      const repo = l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/');

      l.replace(
        l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') +
        repo + '/?/' +
        l.pathname.slice(repo.length + 1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
