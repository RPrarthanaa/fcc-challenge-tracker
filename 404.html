<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect to index.html, preserving the path in a query string
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(
        window.location.origin + '/YOUR_REPO_NAME/?redirect=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
